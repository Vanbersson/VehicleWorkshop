<p-toast />
<p-confirmDialog [style]="{ width: '29rem', maxWidth: 'calc(100vw - 2rem)' }" [closable]="true" [dismissableMask]="false">
    <ng-template #message let-message>
        <div class="logout-content">
            <span class="logout-icon"><i class="pi pi-sign-out" aria-hidden="true"></i></span>
            <div class="logout-description">
                <span class="logout-eyebrow">MINHA CONTA</span>
                <h3>Deseja encerrar sua sessão?</h3>
                <p>{{ message.message }}</p>
            </div>
        </div>
    </ng-template>
</p-confirmDialog>
