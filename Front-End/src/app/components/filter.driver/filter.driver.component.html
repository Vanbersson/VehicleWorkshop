<button pButton type="button" icon="pi pi-filter" class="p-button-warn" [disabled]="isDisabled" (click)="showDialog()"></button>

<!-- Filter Driver -->
<p-dialog [(visible)]="dialogVisibleDriver" header="Pesquisa de motorista" [modal]="true" [maximizable]="true"
    [style]="{ width: '70rem'}"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [draggable]="false" [resizable]="false">
    <form [formGroup]="formDriver" (ngSubmit)="filterDriver()">
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12 md:col-span-2">
                <label for="driverId">Código</label>
                  <p-inputNumber id="driverId" mode="decimal" [useGrouping]="false" formControlName="id" fluid />
            </div>
            <div class="col-span-12 md:col-span-10">
                <label for="driverNameId">Nome</label>
                <input pInputText id="driverNameId" class="w-full" type="text" formControlName="name" />
            </div>
            <div class="col-span-12 md:col-span-3">
                <label for="driverCPFId">CPF</label>
                <p-inputMask id="driverCPFId" mask="999.999.999-99" [unmask]="true" formControlName="cpf" fluid/>
            </div>
            <div class="col-span-12 md:col-span-3">
                <label for="driverRGId">RG</label>
                <p-inputNumber id="driverRGId" mode="decimal" [useGrouping]="false" formControlName="rg" fluid/>
            </div>
            <div class="col-span-12 md:col-span-3">
                <label for="drivercnhRegisterId">Nº Registro CNH</label>
                <p-inputNumber id="drivercnhRegisterId" mode="decimal" [useGrouping]="false" formControlName="cnhRegister" fluid/>
            </div>
            <div class="col-span-12 md:col-span-4 mb-4">
                <div class="flex gap-2">
                    <button pButton type="submit" label="Pesquisar" class="p-button-warning w-full" icon="pi pi-search"></button>
                    <button pButton type="button" label="Limpar" class="p-button-danger w-full" icon="pi pi-times" (click)="cleanForm()"></button>
                </div>
            </div>
        </div>
    </form>
    <p-table #tableFilter dataKey="id" [value]="listDrivers()" selectionMode="single"
        [(selection)]="dialogSelectDriver" [globalFilterFields]="['id', 'name','cnpj','cpf']" [paginator]="true"
        [rows]="5" [rowsPerPageOptions]="[5, 10, 20]"
        [tableStyle]="{ 'min-width': '50rem','min-height': '20rem' }" size="small">
        <ng-template pTemplate="caption">
           <div class="flex">
                 <p-iconField iconPosition="left">
                    <p-inputIcon>
                        <i class="pi pi-search"></i>
                    </p-inputIcon>
                    <input pInputText type="text" (input)="tableFilter.filterGlobal($any($event.target).value, 'contains')" placeholder="Pesquisar" />
                </p-iconField>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width: 10%;">Código<p-sortIcon field="id" /></th>
                <th pSortableColumn="name" style="width: 40%;">Nome<p-sortIcon field="name" /></th>
                <th pSortableColumn="cpf" style="width: 20%;">CPF<p-sortIcon field="cpf" /></th>
                <th pSortableColumn="rg" style="width: 15%;">RG<p-sortIcon field="rg" /></th>
                 <th pSortableColumn="cnhRegister" style="width: 15%;">CNH<p-sortIcon field="cnhRegister" /></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-driver>
            <tr [pSelectableRow]="driver">
                <td [ngClass]="{'text-red-300 ': driver.status === disabled}">{{driver.id}}</td>
                <td [ngClass]="{'text-red-300 ': driver.status === disabled}">{{driver.name | uppercase}}</td>
                <td [ngClass]="{'text-red-300 ': driver.status === disabled}">{{ maskCPF(driver.cpf)}}</td>
                <td [ngClass]="{'text-red-300 ': driver.status === disabled}">{{driver.rg}}</td>
                <td [ngClass]="{'text-red-300 ': driver.status === disabled}">{{driver.cnhRegister}}</td>
            </tr>
        </ng-template>
    </p-table>
    <div class="flex flex-col items-center w-full border-b border-surface-200 dark:border-surface-700"></div>
    <div class="flex justify-end gap-2 mt-4">
        <button pButton type="button" pRipple label="Fechar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton type="submit" pRipple label="Confirmar" icon="pi pi-check" class="p-button-text" (click)="selectDriver()"></button>
    </div>
</p-dialog>
