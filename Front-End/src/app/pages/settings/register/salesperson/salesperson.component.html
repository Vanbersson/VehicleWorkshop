<div class="layout-card">
    <p-toast />
    <div class="layout-card-title">
        <span class="text-500 font-medium">Vendedores</span>
        <p-button icon="pi pi-plus" [outlined]="true" label="Novo" (onClick)="newSalesperson()" />
    </div>
    <p-table [value]="salespersons()" showGridlines>
        <ng-template #header>
            <tr>
                <th style="width: 10%;">Código</th>
                <th style="width: 90%;">Vendedor</th>

                <th></th>
            </tr>
        </ng-template>
        <ng-template #body>
            <tr>
                <td>102</td>
                <td>FERRAMENTA</td>
                <td><p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small" /></td>
            </tr>
        </ng-template>

    </p-table>
</div>

<p-dialog header="Cadastro de Vendedores" [(visible)]="visible" [style]="{ width: '64rem' }">
    <form [formGroup]="formPerson " style="min-height: 44rem">
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12 layout-dialog-img">
                @if(photoPerson()){
                <img class="layout-img-large" [src]="photoPerson()" alt="photo mechanic" />
                }
            </div>
             <div class="col-span-12 md:col-span-4 flex align-center">
                <button pButton type="button" label="Selecionar imagem" (click)="onSelectFile()" fluid></button>
            </div> 
            <div class="md:col-span-8">

            </div>
            <div class="col-span-12 md:col-span-4">
                <label for="">Status</label>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3">
                    <div class="flex align-center">
                        <p-radioButton inputId="st1" name="status" [value]="enabled"
                            formControlName="status"></p-radioButton>
                        <label for="st1" class="ml-2">{{enabled}}</label>
                    </div>
                    <div class="flex align-items-center">
                        <p-radioButton inputId="st2" name="status" [value]="disabled"
                            formControlName="status"></p-radioButton>
                        <label for="st2" class="ml-2">{{disabled}}</label>
                    </div>
                </div>
            </div>
            <div class="col-span-12 md:col-span-4">
                <label for="">Vendedor</label>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3">
                    <div class="flex align-center">
                        <p-radioButton inputId="type1" name="type" [value]="IN" formControlName="type"></p-radioButton>
                        <label for="type1" class="ml-2">{{IN}}</label>
                    </div>
                    <div class="flex align-items-center">
                        <p-radioButton inputId="type2" name="type" [value]="EX" formControlName="type"></p-radioButton>
                        <label for="type2" class="ml-2">{{EX}}</label>
                    </div>
                    <div class="flex align-items-center">
                        <p-radioButton inputId="type3" name="type" [value]="BOTH" formControlName="type"></p-radioButton>
                        <label for="type3" class="ml-2">{{BOTH}}</label>
                    </div>
                </div>
            </div>
            
            <div class="col-span-12 md:col-span-4">
                <span>Tipo de Vendas</span>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3 gap-4">
                    <div class="flex items-center">
                        <p-checkbox inputId="typeSales1" name="typeSalesPart" [value]="PART" formControlName="typeSalesPart" />
                        <label for="typeSales1" class="ml-2"> Peças </label>
                    </div>
                    <div class="flex items-center">
                        <p-checkbox inputId="typeSales2" name="typeSalesService" [value]="SERVICE" formControlName="typeSalesService" />
                        <label for="typeSales2" class="ml-2"> Serviços </label>
                    </div>
                    <div class="flex items-center">
                        <p-checkbox inputId="typeSales3" name="typeSalesVehicle" [value]="VEHICLE" formControlName="typeSalesVehicle" />
                        <label for="typeSales3" class="ml-2"> Veículos </label>
                    </div>
                </div>
            </div>
            <div class="col-span-12 md:col-span-2">
                <label for="">Código</label>
                <input type="text" pInputText class="w-full" formControlName="id">
            </div>
            <div class="col-span-12 md:col-span-6">
                <label for="">Nome</label>
                <input type="text" pInputText class="w-full" formControlName="name">
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('name')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-4">
                <label for="vehiclemodelid">Usuário</label>
                <p-select [showClear]="true" [options]="attendantsUser()"
                    optionLabel="name" [style]="{'text-transform':'uppercase'}" formControlName="user" fluid />
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('user')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-2">
                <label for="">CPF</label>
                <p-inputMask mask="999.999.999-99" [unmask]="true" formControlName="cpf" fluid/>
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('cpf')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-1">
                <label for="">DDD</label>
                <p-inputMask mask="99" [unmask]="true" formControlName="dddCellphone" fluid/>
            </div>
            <div class="col-span-12 md:col-span-2">
                <label for="">Celular</label>
                <p-inputMask mask="9 9999-9999" [unmask]="true" formControlName="cellphone" fluid/>
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('cellphone')?.invalid || formPerson.get('dddCellphone')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-2">
                <label>Desconto</label>
                <p-inputNumber suffix="%" class="w-full" formControlName="limitDiscount" fluid/>
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('limitDiscount')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-3">
                <label for="">Grupo de Vendas</label>
                <p-select [showClear]="true" [options]="groups()" optionLabel="description" optionValue="id" [style]="{'text-transform':'uppercase'}" formControlName="group" fluid />
                <small class="block text-sm text-red-500" *ngIf="formPerson.get('group')?.invalid">Campo obrigatório</small>
            </div>
        </div>
    </form>
    <div class="flex flex-col items-center w-full border-b border-surface-200 dark:border-surface-700 mt-4"></div>
    <div class="flex justify-end gap-2 mt-4">
        <button pButton type="button" pRipple label="Fechar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton type="button" pRipple label="Salvar" icon="pi pi-check" class="p-button-text" (click)="save()"></button>
    </div>
</p-dialog>
