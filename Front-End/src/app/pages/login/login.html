<p-toast />
<div class="login-container">
    <div class="card-login">
        <div class="card-login-title">
            <span>Conecte-se</span>
        </div>
        <P class="mb-4">Faça login em sua conta</P>
        <form [formGroup]="formLogin" (submit)="login()" class="w-full">
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-12">
                    <label>Digite seu email</label>
                    <input type="email" pInputText class="w-full" formControlName="email" />
                </div>
                <div class="col-span-12">
                    <label>Digite sua senha</label>
                    <p-password [toggleMask]="true" [feedback]="false" formControlName="password" fluid />
                </div>
                <div class="col-span-12">
                    <p-button type="submit" icon="pi pi-sign-in" label="Entrar" severity="info" fluid />
                </div>
            </div>
        </form>
    </div>

    <div class="card-login-info">
        <div class="info-tile">
            <span>Bem-vindo</span>
        </div>
        <p>Sua oficina perto de você.</p>
    </div>
</div>
