<div class="layout-card">

    <p-toast />
    <div class="layout-card-title">
        <span>Categorias</span>
        <p-button icon="pi pi-plus" [outlined]="true" label="Categoria" (onClick)="showDialog()" />
    </div>
    <p-table #dt dataKey="id" [value]="categories()" [showCurrentPageReport]="true" showGridlines
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Cadastros"
        [globalFilterFields]="['id','description']" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true"
        [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" >
        <ng-template pTemplate="caption">
            <div class="flex justify-between">
                <p-iconField iconPosition="left">
                    <p-inputIcon>
                        <i class="pi pi-search"></i>
                    </p-inputIcon>
                    <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Pesquisar" />
                </p-iconField>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width:10%">Código<p-sortIcon
                        field="id"></p-sortIcon></th>
                <th pSortableColumn="status" style="width:10%">Status<p-sortIcon
                        field="status"></p-sortIcon></th>
                <th pSortableColumn="description" style="width:80%">Descrição<p-sortIcon
                        field="description"></p-sortIcon></th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cat>
            <tr>
                <td>{{cat.id}}</td>
                <td>
                    <i class="pi " [ngClass]="{
                        'pi-times-circle text-red-500':cat.status == disabled,
                        'pi-check-circle text-green-500':cat.status == enabled}">
                    </i>
                     {{ cat.status | uppercase}}
                </td>
                <td>{{cat.description | uppercase}}</td>
                <td><p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="editCategory(cat)" size="small" /></td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Cadastro" [(visible)]="visibleDialog" modal="true" [style]="{width: '450px'}">
    <form [formGroup]="formCat" (ngSubmit)="saveCategory()">
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12">
                <label for="descricao">Descrição</label>
                <input pInputText class="w-full" id="descricao" formControlName="description" />
                <small class="block text-sm text-red-500" *ngIf="formCat.get('description')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-4">
                <label>Qtd. Requisição</label>
                <p-inputNumber [useGrouping]="false" formControlName="quantityReq" fluid/>
            </div>
            <div class="md:col-8"></div>
            <div class="col-span-12 flex items-center gap-2 border border-gray-300 rounded-md p-3">
                <span>Tipo</span>
                <div class="flex gap-2">
                    <div class="flex items-center">
                        <p-radioButton inputId="typeFerrId" name="type" [value]="typeFerr" formControlName="type"></p-radioButton>
                        <label for="typeFerrId" class="ml-2">Ferramenta</label>
                    </div>
                    <div class="flex items-center">
                        <p-radioButton inputId="typeEpiId" name="type" [value]="typeEPI" formControlName="type"></p-radioButton>
                        <label for="typeEpiId" class="ml-2">EPI</label>
                    </div>
                    <div class="flex items-center">
                        <p-radioButton inputId="typeUnifId" name="type" [value]="typeUnif" formControlName="type"></p-radioButton>
                        <label for="typeUnifId" class="ml-2">Uniforme</label>
                    </div>
                    <div class="flex items-center">
                        <p-radioButton inputId="typeOutroId" name="type" [value]="typeOutro" formControlName="type"></p-radioButton>
                        <label for="typeOutroId" class="ml-2">Outro</label>
                    </div>
                </div>
            </div>
            <div class="col-span-12">
                <label for="">Status</label>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3">
                    <div class="flex align-center">
                        <p-radioButton inputId="st1" name="status" [value]="enabled" formControlName="status"></p-radioButton>
                        <label for="st1" class="ml-2">{{enabled}}</label>
                    </div>
                    <div class="flex align-items-center">
                        <p-radioButton inputId="st2" name="status" [value]="disabled" formControlName="status"></p-radioButton>
                        <label for="st2" class="ml-2">{{disabled}}</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col items-center w-full border-b border-surface-200 dark:border-surface-700 mt-4"></div>
        <div class="flex justify-end gap-2 mt-3">
            <button pButton type="button" pRipple label="Fechar" icon="pi pi-times" class="p-button-text"
                (click)=" hideDialog()"></button>
            <button pButton type="submit" pRipple label="Salvar" icon="pi pi-check" class="p-button-text"></button>
        </div>
    </form>
</p-dialog>
