<div class="layout-card">
    <p-toast />
    <div class="layout-card-title">
        <span>Mecânicos</span>
        <p-button icon="pi pi-plus" [outlined]="true" label="Mecânico" (onClick)="showNewMec()" />
    </div>
    <p-table #dt dataKey="id" [value]="mechanics()" [showCurrentPageReport]="true" showGridlines
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Cadastros"
        [globalFilterFields]="['id','name']" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]" size="small">
        <ng-template pTemplate="caption">
            <div class="flex justify-content-between">
                <p-iconField iconPosition="left">
                    <p-inputIcon>
                        <i class="pi pi-search"></i>
                    </p-inputIcon>
                    <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Pesquisar" />
                </p-iconField>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width:10%">Código<p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="status"  style="width:10%">Status<p-sortIcon field="status"></p-sortIcon></th>
                
                <th pSortableColumn="name" style="width:80%">Nome<p-sortIcon field="name"></p-sortIcon></th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-mec>
            <tr>
                <td>{{mec.id}}</td>
                <td>
                    <i class="pi " [ngClass]="{
                        'pi-times-circle text-red-500':mec.status == disabled,
                        'pi-check-circle text-green-500':mec.status == enabled}">
                    </i> {{mec.status}}
                </td>
                <td>{{mec.name | uppercase}}</td>
                <td><p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small" (onClick)="editMecchanic(mec.id)"  /></td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Cadastro" [(visible)]="visibleDialog" modal="true" [style]="{width: '450px'}">
    <form [formGroup]="formMec" (ngSubmit)="save()">
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12 layout-dialog-img">
                @if(photoMec()){
                <img class="layout-img-large" [src]="photoMec()" alt="photo mechanic" />
                }
            </div>
            <div class="col-span-12">
                <label for="descricao">Nome</label>
                <input pInputText class="w-full" id="descricao" formControlName="name" />
                <small class="block text-sm text-red-500" *ngIf="formMec.get('name')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-6">
                <label for="passId">Senha</label>
                <p-inputNumber [useGrouping]="false" formControlName="codePassword" fluid />
                <small class="block text-sm text-red-500" *ngIf="formMec.get('codePassword')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12 md:col-span-6">
                <label>Departamento</label>
                <p-select [options]="departments()" 
                    optionLabel="description" 
                    placeholder="Selecione" 
                    formControlName="department" 
                    [style]="{'text-transform':'uppercase'}" fluid />
                <small class="block text-sm text-red-500" *ngIf="formMec.get('department')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12">
                <button pButton type="button" label="Selecionar imagem" (click)="onSelectFile()" fluid></button>
            </div>
            <!-- <div class="col-span-2 flex items-center">
                <button type="button" pButton icon="pi pi-trash" severity="danger" (click)="deleteFile()"></button>
            </div> -->

            <div class="col-span-12">
                <label for="">Status</label>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3">
                    <div class="flex align-center">
                        <p-radioButton inputId="st1" name="status" [value]="enabled"
                            formControlName="status"></p-radioButton>
                        <label for="st1" class="ml-2">{{enabled}}</label>
                    </div>
                    <div class="flex align-center">
                        <p-radioButton inputId="st2" name="status" [value]="disabled"
                            formControlName="status"></p-radioButton>
                        <label for="st2" class="ml-2">{{disabled}}</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center w-full border-b border-surface-200 dark:border-surface-700 mt-4"></div>

        <div class="flex justify-end gap-2 mt-4">
            <button pButton type="button" pRipple label="Fechar" icon="pi pi-times" class="p-button-text" (click)=" hideDialog()"></button>
            <button pButton type="submit" pRipple label="Salvar" icon="pi pi-check" class="p-button-text"></button>
        </div>
    </form>
</p-dialog>
