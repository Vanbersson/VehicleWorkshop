<div class="layout-card">
    <p-toast />
    <div class="layout-card-title">
        <span>Unidades de Medida</span>
        <p-button icon="pi pi-plus" [outlined]="true" label="Novo" (onClick)="showNewBrand()" />
    </div>
    <p-table #tableModel [value]="listUnit()" showGridlines
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Cadastros"
        [globalFilterFields]="['id','status','unitMeasure','description']" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]">
        <ng-template pTemplate="caption">
            <div class="flex justify-content-between">
                <p-iconField iconPosition="left">
                    <p-inputIcon>
                        <i class="pi pi-search"></i>
                    </p-inputIcon>
                    <input pInputText type="text" (input)="tableModel.filterGlobal($event.target.value, 'contains')" placeholder="Pesquisar" />
                </p-iconField>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width:10%">Código <p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="status" style="width:10%">Status <p-sortIcon field="status"></p-sortIcon></th>
                <th pSortableColumn="unitMeasure" style="width:10%">Sigla<p-sortIcon field="unitMeasure"></p-sortIcon></th>
                <th pSortableColumn="description" style="width:70%">Nome<p-sortIcon field="description"></p-sortIcon></th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-unit>
            <tr>
                <td>{{unit.id}}</td>
                <td>
                    <i class="pi " [ngClass]="{
                        'pi-times-circle text-red-500':unit.status == disabled,
                        'pi-check-circle text-green-500':unit.status == enabled}">
                    </i> {{unit.status | uppercase}}
                </td>
                <td>{{unit.unitMeasure | uppercase}}</td>
                <td>{{unit.description | uppercase}}</td>
                <td>
                    <p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small" (onClick)="edit(unit)"/> 
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

 <p-dialog header="Cadastro da Unidades de Medida" [(visible)]="dialogVisible" [modal]="true" [style]="{width: '450px'}" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
    <form [formGroup]="formUnit" (ngSubmit)="save()">
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-2">
                <label for="unitMeasureId">Sigla</label>
                <input pInputText id="unitMeasureId" class="w-full" formControlName="unitMeasure" maxlength="2"/>
                <small class="block text-sm text-red-500" *ngIf="formUnit.get('unitMeasure')?.invalid">Campo obrigatório</small>
            </div>
            <div class="field col-span-10">
                <label for="nameId">Descrição</label>
                <input pInputText id="nameId" class="w-full" formControlName="description" maxlength="100"/>
                <small class="block text-sm text-red-500" *ngIf="formUnit.get('description')?.invalid">Campo obrigatório</small>
            </div>
            <div class="col-span-12">
                <label for="">Status</label>
                <div class="flex items-center gap-2 border border-gray-300 rounded-md p-3">
                    <div class="flex align-center">
                        <p-radioButton inputId="st1" name="status" [value]="enabled" formControlName="status"></p-radioButton>
                        <label for="st1" class="ml-2">{{enabled}}</label>
                    </div>
                    <div class="flex align-center">
                        <p-radioButton inputId="st2" name="status" [value]="disabled" formControlName="status"></p-radioButton>
                        <label for="st2" class="ml-2">{{disabled}}</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col items-center w-full border-b border-surface-200 dark:border-surface-700 mt-4"></div>
        <div class="flex justify-end gap-2 mt-4">
            <button pButton type="button" pRipple label="Fechar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
            <button pButton type="submit" pRipple label="Salvar" icon="pi pi-check" class="p-button-text"></button>
        </div>
    </form>
</p-dialog>
